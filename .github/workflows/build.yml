name: Build and verify
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 9561c870d7f54dc2ece89b571f03b72e15eb8725
          path: windows-source
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: powershell
        run: ./windows-source/build.ps1 -InnoCompiler 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
      - name: Verify application and installer
        shell: powershell
        run: ./scripts/test-windows.ps1 -SourceRoot windows-source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-evidence
          path: windows-source/build/evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: windows-source/dist/*.exe
          if-no-files-found: error
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Package pinned universal runtime
        run: python3 scripts/package-linux.py
      - name: Unit tests and all engine configurations
        run: python3 -m unittest discover -s dist/Zapret2Manager-3.6.3-linux.1/tests -p test_manager.py -v
      - name: Install test tools
        run: sudo apt-get update -qq && sudo apt-get install -y python3-tk xvfb nftables qemu-user
      - name: GUI smoke test
        run: xvfb-run -a python3 dist/Zapret2Manager-3.6.3-linux.1/zapret_gui.py --smoke-test
      - name: ARM64 real engine profile checks
        run: python3 scripts/test-arm64.py dist/Zapret2Manager-3.6.3-linux.1
      - name: Isolated real packet lifecycle
        run: sudo unshare --net sh -c 'ip link set lo up; ZAPRET_ISOLATED_TEST=1 python3 dist/Zapret2Manager-3.6.3-linux.1/tests/integration.py'
      - name: Staged install and uninstall
        run: |
          cd dist/Zapret2Manager-3.6.3-linux.1
          DESTDIR="$RUNNER_TEMP/zapret-stage" ./install.sh install
          test -x "$RUNNER_TEMP/zapret-stage/usr/local/bin/zapret2-manager"
          DESTDIR="$RUNNER_TEMP/zapret-stage" ./install.sh uninstall
          test ! -e "$RUNNER_TEMP/zapret-stage/opt/zapret2-manager"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-universal
          path: dist/*-universal.tar.gz
          if-no-files-found: error
